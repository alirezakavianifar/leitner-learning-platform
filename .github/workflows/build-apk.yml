name: Android APK Build & Distribution Pipeline

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App Flavor to Build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - premium
          - bazaar
          - myket
          - direct
          - googleplay
          - store
      abi:
        description: 'Target Architecture (ABI)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
          - all
      target_url:
        description: 'Backend Target API URL'
        required: true
        default: 'https://api.rightlearn.ir/api/v1'
        type: string
      send_to_rubika:
        description: 'Send packaged build to Rubika Bot'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Create & Publish GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag (leave empty for pubspec.yaml version, e.g. v1.0.2)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.flavor || 'all' }} - ${{ inputs.abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare Android Environment
        run: |
          cd mobile-app
          flutter clean
          flutter pub get
        shell: bash

      - name: Compile Release APKs & Packages
        run: |
          cd mobile-app
          SELECTED_FLAVOR="${{ inputs.flavor || 'all' }}"
          ABI="${{ inputs.abi || 'arm64-v8a' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir/api/v1' }}"
          
          if [ "$SELECTED_FLAVOR" = "all" ]; then
            FLAVORS=("premium" "bazaar" "myket")
          else
            FLAVORS=("$SELECTED_FLAVOR")
          fi
          
          echo "Target flavors to build: ${FLAVORS[*]} (ABI: $ABI) with API: $API_URL"
          
          SYMBOLS_DIR="build/app/outputs/symbols"
          APK_DIR="build/app/outputs/flutter-apk"
          
          for FLAVOR in "${FLAVORS[@]}"; do
            echo "===================================================="
            echo " Compiling Release APK for flavor: $FLAVOR"
            echo "===================================================="
            
            BUILD_ARGS=(
              "build" "apk"
              "--release"
              "--flavor" "$FLAVOR"
              "-t" "lib/main_${FLAVOR}.dart"
              "--dart-define=API_BASE_URL=$API_URL"
              "--obfuscate"
              "--split-debug-info=$SYMBOLS_DIR"
              "--tree-shake-icons"
            )
            
            if [ "$ABI" = "arm64-v8a" ]; then
              BUILD_ARGS+=("--split-per-abi" "--target-platform" "android-arm64")
            elif [ "$ABI" = "all" ]; then
              BUILD_ARGS+=("--split-per-abi")
            fi
            
            flutter "${BUILD_ARGS[@]}"
            
            PRIMARY_APK=""
            if [ "$ABI" = "arm64-v8a" ]; then
              for candidate in \
                "$APK_DIR/app-arm64-v8a-${FLAVOR}-release.apk" \
                "$APK_DIR/app-${FLAVOR}-arm64-v8a-release.apk" \
                "$APK_DIR/app-arm64-v8a-release.apk" \
                "$APK_DIR/app-${FLAVOR}-release.apk"; do
                if [ -f "$candidate" ]; then
                  PRIMARY_APK="$candidate"
                  break
                fi
              done
            elif [ "$ABI" = "universal" ]; then
              for candidate in \
                "$APK_DIR/app-${FLAVOR}-release.apk" \
                "$APK_DIR/app-release.apk"; do
                if [ -f "$candidate" ]; then
                  PRIMARY_APK="$candidate"
                  break
                fi
              done
            elif [ "$ABI" = "all" ]; then
              cp "$APK_DIR"/*.apk "${GITHUB_WORKSPACE}/" 2>/dev/null || true
              PRIMARY_APK=$(ls "$APK_DIR"/*arm64*.apk 2>/dev/null | head -n 1)
              if [ -z "$PRIMARY_APK" ]; then
                PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
              fi
            fi
            
            if [ -z "$PRIMARY_APK" ] || [ ! -f "$PRIMARY_APK" ]; then
              PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
            fi
            
            if [ -f "$PRIMARY_APK" ]; then
              echo "Found compiled APK for $FLAVOR: $PRIMARY_APK"
              cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-${FLAVOR}-release.apk"
              if [ "$ABI" = "arm64-v8a" ]; then
                cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-${FLAVOR}-arm64-v8a-release.apk"
              fi
              
              cd "${GITHUB_WORKSPACE}"
              zip -j "app-${FLAVOR}-release.zip" "app-${FLAVOR}-release.apk"
              echo "Created archive: app-${FLAVOR}-release.zip"
              cd mobile-app
            else
              echo "Error: No APK file was generated for $FLAVOR!"
              exit 1
            fi
  
            if [ "$FLAVOR" = "googleplay" ]; then
              echo "Building Google Play Android App Bundle (.aab)..."
              flutter build appbundle \
                --release \
                --flavor googleplay \
                -t lib/main_googleplay.dart \
                --dart-define=API_BASE_URL=$API_URL \
                --obfuscate \
                --split-debug-info=$SYMBOLS_DIR \
                --tree-shake-icons
              
              AAB_FILE=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
              if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
                echo "Found generated AAB: $AAB_FILE"
                cp "$AAB_FILE" "${GITHUB_WORKSPACE}/app-googleplay-release.aab"
              fi
            fi
          done
          
          cd "${GITHUB_WORKSPACE}"
          echo "All generated binaries:"
          ls -lh app-*
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ inputs.flavor || 'all' }}-${{ inputs.abi || 'arm64-v8a' }}
          path: |
            app-*-release.apk
            app-*-release.aab
            app-*-release.zip
          retention-days: 14

      - name: Resolve Release Tag & Information
        if: ${{ inputs.publish_release != false && success() }}
        id: release_info
        run: |
          FLAVOR="${{ inputs.flavor || 'all' }}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            RAW_VER=$(grep '^version:' mobile-app/pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
            VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
            BUILD_NUM=$(echo "$RAW_VER" | cut -d'+' -f2)
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.0.0"
            fi
            TAG="v${VER_NAME}"
          fi
          TITLE="Release ${TAG}"
          if [ -n "$BUILD_NUM" ] && [ "$BUILD_NUM" != "$VER_NAME" ]; then
            TITLE="Release ${TAG} (Build ${BUILD_NUM})"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
        shell: bash

      - name: Publish Official GitHub Release
        if: ${{ inputs.publish_release != false && success() }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ### 📱 Leitner Learning Platform Android Release (${{ steps.release_info.outputs.tag }})
            
            #### 📦 Download Packages
            - 🟢 **Android Direct (ZarinPal):** `app-premium-release.apk` & `app-premium-release.zip`
            - ☕ **Android Cafe Bazaar:** `app-bazaar-release.apk` & `app-bazaar-release.zip`
            - 🛍️ **Android Myket:** `app-myket-release.apk` & `app-myket-release.zip`
            
            ---
            #### 📝 What's Changed
          files: |
            app-*-release.apk
            app-*-release.aab
            app-*-release.zip

  # ===========================================================================
  #  2. Upload Android Packages to Rubika Bot (Independent Job)
  # ===========================================================================
  upload-rubika:
    name: Send to Rubika Bot
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: ${{ always() && !cancelled() && needs.build-apk.result == 'success' && (github.event_name == 'push' || inputs.send_to_rubika != false) }}
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Download Android Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'android-build-*'
          path: release-packages
          merge-multiple: true

      - name: Dispatch Packages to Rubika Bot
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN || 'CBGADB0AFGZDLMGWVNLANQKRQDWYEONKZZUGWWHCFZVZDUUFQYKAVHKZMABOOHXL' }}
        run: |
          SELECTED_FLAVOR="${{ inputs.flavor || 'all' }}"
          if [ "$SELECTED_FLAVOR" = "all" ]; then
            FLAVORS=("premium" "bazaar" "myket")
          else
            FLAVORS=("$SELECTED_FLAVOR")
          fi
          
          echo "Dispatching packages to Rubika Bot for flavors: ${FLAVORS[*]}"
          for FLV in "${FLAVORS[@]}"; do
            ZIP_FILE="release-packages/app-${FLV}-release.zip"
            APK_FILE="release-packages/app-${FLV}-release.apk"
            if [ -f "$ZIP_FILE" ]; then
              echo "Sending $ZIP_FILE to Rubika Bot..."
              python3 scripts/upload-to-rubika.py --file "$ZIP_FILE" || true
            elif [ -f "$APK_FILE" ]; then
              echo "Sending $APK_FILE to Rubika Bot..."
              python3 scripts/upload-to-rubika.py --file "$APK_FILE" || true
            else
              echo "Notice: No package found for flavor $FLV in release-packages/"
            fi
          done
        shell: bash



