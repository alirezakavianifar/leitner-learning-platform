name: iOS Build & Distribution Pipeline

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App Flavor to Build'
        required: true
        default: 'premium'
        type: choice
        options:
          - premium
          - store
      target_url:
        description: 'Backend Target API URL'
        required: true
        default: 'https://api.rightlearn.ir'
        type: string
      build_type:
        description: 'Build Target'
        required: true
        default: 'both'
        type: choice
        options:
          - ipa
          - simulator
          - both
      send_to_rubika:
        description: 'Send packaged build to Rubika Bot'
        required: false
        default: true
        type: boolean

jobs:
  build-ios:
    name: Build iOS (${{ inputs.flavor || 'premium' }})
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Dependencies
        run: |
          cd mobile-app
          flutter pub get
          flutter build ios --config-only -t "lib/main_${{ inputs.flavor || 'premium' }}.dart"
        shell: bash

      # 1. Build iOS Simulator Bundle (Appetize.io & Simulator Ready)
      - name: Build iOS Simulator App
        if: ${{ inputs.build_type == 'simulator' || inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd mobile-app
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir' }}"
          echo "Building iOS Simulator release for flavor: $FLAVOR"
          flutter build ios --simulator --release -t "lib/main_${FLAVOR}.dart" --dart-define=API_BASE_URL="$API_URL"
          
          # Package Simulator .app to ZIP for Appetize.io & Simulators
          cd build/ios/iphonesimulator
          zip -r -y "${GITHUB_WORKSPACE}/app-${FLAVOR}-ios-simulator.zip" Runner.app
          echo "Created simulator archive: app-${FLAVOR}-ios-simulator.zip"
        shell: bash

      # 2. Build Physical iOS IPA (Sideloading / AltStore / TestFlight)
      - name: Build iOS Release Bundle & Package IPA
        if: ${{ inputs.build_type == 'ipa' || inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd mobile-app
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir' }}"
          echo "Building iOS device release for flavor: $FLAVOR"
          
          # Compile unsigned release bundle
          flutter build ios --release --no-codesign -t "lib/main_${FLAVOR}.dart" --dart-define=API_BASE_URL="$API_URL"
          
          # Package into standard IPA structure (Payload/Runner.app)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y "${GITHUB_WORKSPACE}/app-${FLAVOR}-release.ipa" Payload
          
          # Also package into universal zip for distribution
          cd "${GITHUB_WORKSPACE}"
          zip -r "app-${FLAVOR}-ios-release.zip" "app-${FLAVOR}-release.ipa"
          echo "Created IPA archive: app-${FLAVOR}-release.ipa and app-${FLAVOR}-ios-release.zip"
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.flavor || 'premium' }}
          path: |
            app-*-release.ipa
            app-*-ios-release.zip
            app-*-ios-simulator.zip
          retention-days: 14

      - name: Send to Rubika Bot
        if: ${{ (inputs.send_to_rubika != false) && success() }}
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN || 'CBGADB0AFGZDLMGWVNLANQKRQDWYEONKZZUGWWHCFZVZDUUFQYKAVHKZMABOOHXL' }}
        run: |
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          IPA_ZIP="app-${FLAVOR}-ios-release.zip"
          if [ -f "$IPA_ZIP" ]; then
            echo "Sending $IPA_ZIP to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "$IPA_ZIP"
          elif [ -f "app-${FLAVOR}-ios-simulator.zip" ]; then
            echo "Sending simulator bundle to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "app-${FLAVOR}-ios-simulator.zip"
          fi
        shell: bash
