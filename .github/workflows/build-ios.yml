name: iOS Build & Distribution Pipeline

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App Flavor to Build'
        required: true
        default: 'premium'
        type: choice
        options:
          - premium
          - direct
          - bazaar
          - myket
          - googleplay
          - store
      target_url:
        description: 'Backend Target API URL'
        required: true
        default: 'https://api.rightlearn.ir'
        type: string
      publish_release:
        description: 'Create & Publish GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag (leave empty for pubspec.yaml version, e.g. v1.0.2)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release IPA (${{ inputs.flavor || 'premium' }})
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare iOS Environment
        run: |
          cd mobile-app
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock build
          flutter pub get
        shell: bash

      # 1. Build Physical iOS Release Bundle & Package IPA
      - name: Build iOS Release Bundle & Package IPA
        run: |
          cd mobile-app
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir' }}"
          echo "Building iOS device release for flavor: $FLAVOR with API: $API_URL"
          
          # Compile unsigned release bundle
          flutter build ios --release --no-codesign -t "lib/main_${FLAVOR}.dart" --dart-define=API_BASE_URL="$API_URL"
          
          # Package into standard IPA structure (Payload/Runner.app)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y "${GITHUB_WORKSPACE}/app-${FLAVOR}-release.ipa" Payload
          
          # Also package into universal zip for distribution
          cd "${GITHUB_WORKSPACE}"
          zip -r "app-${FLAVOR}-ios-release.zip" "app-${FLAVOR}-release.ipa"
          echo "Created IPA archive: app-${FLAVOR}-release.ipa and app-${FLAVOR}-ios-release.zip"
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.flavor || 'premium' }}
          path: |
            app-*-release.ipa
            app-*-ios-release.zip
          retention-days: 14

      - name: Resolve Release Tag & Information
        if: ${{ inputs.publish_release != false && success() }}
        id: release_info
        run: |
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            RAW_VER=$(grep '^version:' mobile-app/pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
            VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
            BUILD_NUM=$(echo "$RAW_VER" | cut -d'+' -f2)
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.0.0"
            fi
            TAG="v${VER_NAME}"
          fi
          TITLE="Release ${TAG}"
          if [ -n "$BUILD_NUM" ] && [ "$BUILD_NUM" != "$VER_NAME" ]; then
            TITLE="Release ${TAG} (Build ${BUILD_NUM})"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
        shell: bash

      - name: Publish Official GitHub Release
        if: ${{ inputs.publish_release != false && success() }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ### 📱 Leitner Learning Platform iOS Release (${{ steps.release_info.outputs.tag }})
            
            **Flavor:** `${{ steps.release_info.outputs.flavor }}`
            
            #### 📦 Download Packages
            - **iOS IPA:** Release package (`.ipa`) & distribution archive (`.zip`)
            
            ---
            #### 📝 What's Changed
          files: |
            app-*-release.ipa
            app-*-ios-release.zip

