name: Unified Mobile Build Pipeline (Android & iOS)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'mobile-app/**'
      - 'scripts/**'
      - '.github/workflows/build-mobile.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'App Flavor to Build'
        required: true
        default: 'premium'
        type: choice
        options:
          - premium
          - direct
          - bazaar
          - myket
          - googleplay
          - store
      android_abi:
        description: 'Android Target Architecture (ABI)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - universal
          - all
      target_url:
        description: 'Backend Target API URL'
        required: true
        default: 'https://api.rightlearn.ir/api/v1'
        type: string
      send_to_rubika:
        description: 'Send Android build package to Rubika Bot'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Create & Publish GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag (leave empty for pubspec.yaml version, e.g. v1.0.2)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  # ===========================================================================
  #  1. Android APK Build Job (Ubuntu Cloud Runner)
  # ===========================================================================
  build-android:
    name: Android APK (${{ inputs.flavor || 'premium' }} - ${{ inputs.android_abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare Android Environment
        run: |
          cd mobile-app
          flutter clean
          flutter pub get
        shell: bash

      - name: Compile Release APK & Package
        run: |
          cd mobile-app
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          ABI="${{ inputs.android_abi || 'arm64-v8a' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir/api/v1' }}"
          
          echo "Building Android APK for flavor: $FLAVOR (ABI: $ABI) with API: $API_URL"
          
          SYMBOLS_DIR="build/app/outputs/symbols"
          BUILD_ARGS=(
            "build" "apk"
            "--release"
            "--flavor" "$FLAVOR"
            "-t" "lib/main_${FLAVOR}.dart"
            "--dart-define=API_BASE_URL=$API_URL"
            "--obfuscate"
            "--split-debug-info=$SYMBOLS_DIR"
            "--tree-shake-icons"
          )
          
          if [ "$ABI" = "arm64-v8a" ]; then
            BUILD_ARGS+=("--split-per-abi" "--target-platform" "android-arm64")
          elif [ "$ABI" = "all" ]; then
            BUILD_ARGS+=("--split-per-abi")
          fi
          
          flutter "${BUILD_ARGS[@]}"
          
          APK_DIR="build/app/outputs/flutter-apk"
          PRIMARY_APK=""
          
          if [ "$ABI" = "arm64-v8a" ]; then
            for candidate in \
              "$APK_DIR/app-arm64-v8a-${FLAVOR}-release.apk" \
              "$APK_DIR/app-${FLAVOR}-arm64-v8a-release.apk" \
              "$APK_DIR/app-arm64-v8a-release.apk" \
              "$APK_DIR/app-${FLAVOR}-release.apk"; do
              if [ -f "$candidate" ]; then
                PRIMARY_APK="$candidate"
                break
              fi
            done
          elif [ "$ABI" = "universal" ]; then
            for candidate in \
              "$APK_DIR/app-${FLAVOR}-release.apk" \
              "$APK_DIR/app-release.apk"; do
              if [ -f "$candidate" ]; then
                PRIMARY_APK="$candidate"
                break
              fi
            done
          elif [ "$ABI" = "all" ]; then
            cp "$APK_DIR"/*.apk "${GITHUB_WORKSPACE}/" 2>/dev/null || true
            PRIMARY_APK=$(ls "$APK_DIR"/*arm64*.apk 2>/dev/null | head -n 1)
            if [ -z "$PRIMARY_APK" ]; then
              PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
            fi
          fi
          
          if [ -z "$PRIMARY_APK" ] || [ ! -f "$PRIMARY_APK" ]; then
            PRIMARY_APK=$(ls "$APK_DIR"/*.apk 2>/dev/null | head -n 1)
          fi
          
          if [ -f "$PRIMARY_APK" ]; then
            echo "Found compiled APK: $PRIMARY_APK"
            cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-${FLAVOR}-release.apk"
            if [ "$ABI" = "arm64-v8a" ]; then
              cp "$PRIMARY_APK" "${GITHUB_WORKSPACE}/app-${FLAVOR}-arm64-v8a-release.apk"
            fi
            
            cd "${GITHUB_WORKSPACE}"
            zip -j "app-${FLAVOR}-release.zip" "app-${FLAVOR}-release.apk"
            echo "Created archive: app-${FLAVOR}-release.zip"
            ls -lh app-*
          else
            echo "Error: No APK file was generated!"
            exit 1
          fi

          if [ "$FLAVOR" = "googleplay" ]; then
            echo "Building Google Play Android App Bundle (.aab)..."
            flutter build appbundle \
              --release \
              --flavor googleplay \
              -t lib/main_googleplay.dart \
              --dart-define=API_BASE_URL=$API_URL \
              --obfuscate \
              --split-debug-info=$SYMBOLS_DIR \
              --tree-shake-icons
            
            AAB_FILE=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
            if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
              echo "Found generated AAB: $AAB_FILE"
              cp "$AAB_FILE" "${GITHUB_WORKSPACE}/app-googleplay-release.aab"
            fi
          fi
        shell: bash

      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ inputs.flavor || 'premium' }}-${{ inputs.android_abi || 'arm64-v8a' }}
          path: |
            app-*-release.apk
            app-*-release.aab
            app-*-release.zip
          retention-days: 14

      - name: Send Android Package to Rubika Bot
        if: ${{ (github.event_name == 'push' || inputs.send_to_rubika != false) && success() }}
        continue-on-error: true
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN || 'CBGADB0AFGZDLMGWVNLANQKRQDWYEONKZZUGWWHCFZVZDUUFQYKAVHKZMABOOHXL' }}
        run: |
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          ZIP_FILE="app-${FLAVOR}-release.zip"
          if [ -f "$ZIP_FILE" ]; then
            echo "Sending $ZIP_FILE to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "$ZIP_FILE"
          elif [ -f "app-${FLAVOR}-release.apk" ]; then
            echo "Sending APK to Rubika Bot..."
            python3 scripts/upload-to-rubika.py --file "app-${FLAVOR}-release.apk"
          fi
        shell: bash

  # ===========================================================================
  #  2. iOS Release IPA Build Job (macOS Apple Silicon Runner)
  # ===========================================================================
  build-ios:
    name: iOS Release IPA (${{ inputs.flavor || 'premium' }})
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests requests_toolbelt urllib3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Prepare iOS Environment
        run: |
          cd mobile-app
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock build
          flutter pub get
        shell: bash

      # 2. Build Physical iOS Release Bundle & Package IPA
      - name: Build iOS Release Bundle & Package IPA
        run: |
          cd mobile-app
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          API_URL="${{ inputs.target_url || 'https://api.rightlearn.ir/api/v1' }}"
          echo "Building iOS device release for flavor: $FLAVOR with API: $API_URL"
          
          # Compile unsigned release bundle
          flutter build ios --release --no-codesign -t "lib/main_${FLAVOR}.dart" --dart-define=API_BASE_URL="$API_URL"
          
          # Package into standard IPA structure (Payload/Runner.app)
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y "${GITHUB_WORKSPACE}/app-${FLAVOR}-release.ipa" Payload
          
          # Also package into universal zip for distribution
          cd "${GITHUB_WORKSPACE}"
          zip -r "app-${FLAVOR}-ios-release.zip" "app-${FLAVOR}-release.ipa"
          echo "Created IPA archive: app-${FLAVOR}-release.ipa and app-${FLAVOR}-ios-release.zip"
        shell: bash

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.flavor || 'premium' }}
          path: |
            app-*-release.ipa
            app-*-ios-release.zip
          retention-days: 14

  # ===========================================================================
  #  3. Publish Official GitHub Release
  # ===========================================================================
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && !cancelled() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success') && (github.event_name == 'push' || inputs.publish_release != false)
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Directory
        run: mkdir -p release-assets
        shell: bash

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve Release Tag & Information
        id: release_info
        run: |
          FLAVOR="${{ inputs.flavor || 'premium' }}"
          
          # 1. Determine Tag Name
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            RAW_VER=$(grep '^version:' mobile-app/pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r')
            VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
            BUILD_NUM=$(echo "$RAW_VER" | cut -d'+' -f2)
            if [ -z "$VER_NAME" ]; then
              VER_NAME="1.0.0"
            fi
            TAG="v${VER_NAME}"
          fi
          
          # 2. Determine Title
          TITLE="Release ${TAG}"
          if [ -n "$BUILD_NUM" ] && [ "$BUILD_NUM" != "$VER_NAME" ]; then
            TITLE="Release ${TAG} (Build ${BUILD_NUM})"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          
          echo "Resolved Tag: $TAG"
          echo "Resolved Title: $TITLE"
          echo "=== Release Assets in directory ==="
          ls -lh release-assets/ || true
        shell: bash

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ### 📱 Leitner Learning Platform Mobile Release (${{ steps.release_info.outputs.tag }})
            
            **Flavor:** `${{ steps.release_info.outputs.flavor }}`
            
            #### 📦 Download Packages
            - **Android APK:** Direct installable APK file (`.apk`) & distribution archive (`.zip`)
            - **iOS IPA:** Unsigned release package (`.ipa`) & distribution archive (`.zip`)
            
            ---
            #### 📝 What's Changed
          files: |
            release-assets/*.apk
            release-assets/*.zip
            release-assets/*.aab
            release-assets/*.ipa

