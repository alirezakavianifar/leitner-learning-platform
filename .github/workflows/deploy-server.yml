name: Server Deployment Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'admin-panel/**'
      - 'deployment/**'
      - '.env*'
      - 'scripts/deploy-to-server.ps1'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      sms:
        description: 'SMS Gateway Status (ON / OFF)'
        required: true
        default: 'ON'
        type: choice
        options:
          - 'ON'
          - 'OFF'
      server_ip:
        description: 'Target Deployment Server IP'
        required: true
        default: '45.94.215.188'
        type: string
      server_user:
        description: 'Server SSH User'
        required: true
        default: 'root'
        type: string

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
      SERVER_USER: ${{ inputs.server_user || 'root' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend & Worker
        run: |
          dotnet publish backend/LeitnerPlatform.API/LeitnerPlatform.API.csproj -c Release -o ./publish /p:UseAppHost=false
          dotnet publish backend/LeitnerPlatform.BackgroundWorker/LeitnerPlatform.BackgroundWorker.csproj -c Release -o ./publish /p:UseAppHost=false
          # Strip debug symbols and course archives from publish payload (courses synced separately)
          rm -f ./publish/*.pdb
          rm -rf ./publish/wwwroot/courses
          rm -rf ./publish/runtimes/win* ./publish/runtimes/osx*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Admin Panel
        run: |
          cd admin-panel
          npm ci
          VITE_API_BASE_URL=/api/v1 npm run build
          cd ..

      - name: Configure SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SERVER_SSH_KEY (or DEPLOY_SSH_KEY) is not set in repository secrets!"
            echo "Please add your deployment SSH private key to GitHub Secrets as SERVER_SSH_KEY."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_deploy
          chmod 600 ~/.ssh/id_rsa_deploy

          # Global SSH configuration for resilient non-blocking CI/CD connections
          cat << EOF > ~/.ssh/config
          Host *
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IPQoS none
            ServerAliveInterval 10
            ServerAliveCountMax 6
            TCPKeepAlive yes
            ConnectTimeout 30
            Compression yes
          EOF
          chmod 600 ~/.ssh/config

          # Add remote server host keys
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Establish and verify SSH connection with retry
          echo ">> Verifying SSH connection to $SERVER_USER@$SERVER_IP..."
          connected=false
          for i in 1 2 3 4; do
            if timeout 30 ssh -n -T "$SERVER_USER@$SERVER_IP" "echo '>> Connection established.'" ; then
              connected=true
              break
            fi
            echo "::warning::Initial SSH connection attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

          if [ "$connected" != "true" ]; then
            echo "::error::Failed to connect to server after 4 attempts."
            exit 1
          fi

      - name: Configure SMS Gateway in .env
        run: |
          SMS_SETTING="${{ inputs.sms || 'ON' }}"
          echo "Setting SMS Gateway state to: $SMS_SETTING"
          if [ -f ".env" ]; then
            if [ "$SMS_SETTING" = "OFF" ]; then
              sed -i 's/^[[:space:]]*SMS_GATEWAY_API_KEY[[:space:]]*=/# SMS_GATEWAY_API_KEY=/' .env
            else
              sed -i 's/^[[:space:]]*#[[:space:]]*SMS_GATEWAY_API_KEY[[:space:]]*=/SMS_GATEWAY_API_KEY=/' .env
            fi
          fi

      - name: Sync Deployment Payload to Server (Rsync)
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Ensuring target directories exist on $SERVER_USER@$SERVER_IP..."
          timeout 30 ssh -n -T "$SERVER_USER@$SERVER_IP" \
            "mkdir -p /opt/leitner-platform/publish /opt/leitner-platform/admin-panel/dist /opt/leitner-platform/deployment"

          echo ">> Syncing published binaries and application assets incrementally..."
          synced=false
          for i in 1 2 3 4; do
            if rsync -avz --partial --delete \
                --exclude="*.pdb" \
                --exclude="wwwroot/courses" \
                --exclude="runtimes/win*" \
                --exclude="runtimes/osx*" \
                publish/ "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/publish/" && \
               rsync -avz --partial --delete \
                admin-panel/dist/ "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/admin-panel/dist/" && \
               rsync -avz --partial \
                deployment/ "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/deployment/" && \
               rsync -avz --partial \
                .dockerignore .env* "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/"; then
              echo ">> Deployment payload synced successfully on attempt $i."
              synced=true
              break
            fi
            echo "::warning::Rsync sync attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

          if [ "$synced" != "true" ]; then
            echo "::error::Failed to sync deployment payload to remote server after 4 attempts."
            exit 1
          fi

      - name: Sync Course Package Assets (Incremental)
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          COURSES_DIR="backend/LeitnerPlatform.API/wwwroot/courses"
          if [ -d "$COURSES_DIR" ]; then
            echo ">> Ensuring courses directory exists on server..."
            timeout 30 ssh -n -T "$SERVER_USER@$SERVER_IP" "mkdir -p /opt/leitner-platform/$COURSES_DIR"

            echo ">> Incremental sync for course packages..."
            for i in 1 2 3 4; do
              if rsync -avz --partial --size-only --include="*.zip" --exclude="*" \
                "$COURSES_DIR/" "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/$COURSES_DIR/"; then
                echo ">> Course packages synced successfully."
                break
              fi
              echo "::warning::Course package rsync attempt $i/4 failed. Retrying in 5s..."
              sleep 5
            done
          fi

      - name: Build & Run Docker Containers
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Building and launching Docker Compose stack..."
          for i in 1 2 3 4; do
            if timeout 300 ssh -n -T "$SERVER_USER@$SERVER_IP" \
              "cd /opt/leitner-platform && docker compose -f deployment/docker-compose.yml --env-file .env up -d --build"; then
              echo ">> Docker compose deployment succeeded on attempt $i."
              break
            fi
            echo "::warning::Docker compose attempt $i/4 failed or timed out. Retrying in 5s..."
            sleep 5
          done

      - name: Verify Container State & Health
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Running Containers:"
          timeout 60 ssh -n -T "$SERVER_USER@$SERVER_IP" \
            "cd /opt/leitner-platform && docker compose -f deployment/docker-compose.yml ps"

          echo ">> Testing Courses Endpoint..."
          sleep 5
          STATUS_CODE=$(timeout 60 ssh -n -T "$SERVER_USER@$SERVER_IP" "curl -k -s -o /dev/null -w '%{http_code}' https://api.rightlearn.ir/api/v1/courses || echo '000'")
          echo "Courses endpoint HTTP status: $STATUS_CODE"
          echo ">> Deployment completed successfully! 🎉"
