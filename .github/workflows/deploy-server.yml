name: Server Deployment Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'admin-panel/**'
      - 'deployment/**'
      - '.env*'
      - 'scripts/deploy-to-server.ps1'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:
    inputs:
      sms:
        description: 'SMS Gateway Status (ON / OFF)'
        required: true
        default: 'ON'
        type: choice
        options:
          - 'ON'
          - 'OFF'
      server_ip:
        description: 'Target Deployment Server IP'
        required: true
        default: '45.94.215.188'
        type: string
      server_user:
        description: 'Server SSH User'
        required: true
        default: 'root'
        type: string

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
      SERVER_USER: ${{ inputs.server_user || 'root' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish .NET Backend & Worker
        run: |
          dotnet publish backend/LeitnerPlatform.API/LeitnerPlatform.API.csproj -c Release -o ./publish /p:UseAppHost=false
          dotnet publish backend/LeitnerPlatform.BackgroundWorker/LeitnerPlatform.BackgroundWorker.csproj -c Release -o ./publish /p:UseAppHost=false
          # Strip debug symbols and course archives from publish payload (courses synced separately)
          rm -f ./publish/*.pdb
          rm -rf ./publish/wwwroot/courses
          rm -rf ./publish/runtimes/win* ./publish/runtimes/osx*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Admin Panel
        run: |
          cd admin-panel
          npm ci
          VITE_API_BASE_URL=/api/v1 npm run build
          cd ..

      - name: Configure SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret SERVER_SSH_KEY (or DEPLOY_SSH_KEY) is not set in repository secrets!"
            echo "Please add your deployment SSH private key to GitHub Secrets as SERVER_SSH_KEY."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa_deploy
          chmod 600 ~/.ssh/id_rsa_deploy

          # Global SSH configuration with ControlMaster multiplexing for resilient CI/CD connections
          cat << EOF > ~/.ssh/config
          Host *
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IPQoS none
            ServerAliveInterval 15
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 60
            Compression yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 15m
          EOF
          chmod 600 ~/.ssh/config

          # Add remote server host keys
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

          # Establish and verify persistent SSH master connection with retry
          echo ">> Verifying SSH connection to $SERVER_USER@$SERVER_IP..."
          connected=false
          for i in 1 2 3 4; do
            if ssh -n -T "$SERVER_USER@$SERVER_IP" "echo '>> Connection established.'" ; then
              connected=true
              break
            fi
            echo "::warning::Initial SSH connection attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

          if [ "$connected" != "true" ]; then
            echo "::error::Failed to connect to server after 4 attempts."
            exit 1
          fi

      - name: Configure SMS Gateway in .env
        run: |
          SMS_SETTING="${{ inputs.sms || 'ON' }}"
          echo "Setting SMS Gateway state to: $SMS_SETTING"
          if [ -f ".env" ]; then
            if [ "$SMS_SETTING" = "OFF" ]; then
              sed -i 's/^[[:space:]]*SMS_GATEWAY_API_KEY[[:space:]]*=/# SMS_GATEWAY_API_KEY=/' .env
            else
              sed -i 's/^[[:space:]]*#[[:space:]]*SMS_GATEWAY_API_KEY[[:space:]]*=/SMS_GATEWAY_API_KEY=/' .env
            fi
          fi

      - name: Create Production Deployment Archive
        run: |
          ARCHIVE_NAME="leitner_deploy_$(date +%s).tar.gz"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

          tar -czf "$ARCHIVE_NAME" \
            --exclude="admin-panel/node_modules" \
            --exclude="admin-panel/src" \
            --exclude="admin-panel/public" \
            --exclude="mobile-app" --exclude="docs" --exclude="*.apk" \
            publish admin-panel deployment .dockerignore .env*

          echo "Archive created: $ARCHIVE_NAME ($(du -h "$ARCHIVE_NAME" | cut -f1))"

      - name: Upload & Extract Source Archive on Server
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Uploading $ARCHIVE_NAME to $SERVER_USER@$SERVER_IP:/tmp/..."
          for i in 1 2 3 4; do
            scp "$ARCHIVE_NAME" "$SERVER_USER@$SERVER_IP:/tmp/$ARCHIVE_NAME" && break
            echo "::warning::SCP upload attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

          echo ">> Extracting on remote server into /opt/leitner-platform..."
          for i in 1 2 3 4; do
            ssh -n -T "$SERVER_USER@$SERVER_IP" \
              "mkdir -p /opt/leitner-platform && tar -xzf /tmp/$ARCHIVE_NAME -C /opt/leitner-platform && rm -f /tmp/$ARCHIVE_NAME && echo '>> Extraction completed successfully.'" && break
            echo "::warning::Remote extraction attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

      - name: Sync Course Package Assets (Incremental)
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          COURSES_DIR="backend/LeitnerPlatform.API/wwwroot/courses"
          if [ -d "$COURSES_DIR" ]; then
            ssh -n -T "$SERVER_USER@$SERVER_IP" "mkdir -p /opt/leitner-platform/$COURSES_DIR"
            REMOTE_LS=$(ssh -n -T "$SERVER_USER@$SERVER_IP" "ls -l /opt/leitner-platform/$COURSES_DIR 2>/dev/null || true")

            for zip_file in "$COURSES_DIR"/*.zip; do
              [ -e "$zip_file" ] || continue
              file_name=$(basename "$zip_file")
              file_size=$(stat -c%s "$zip_file" 2>/dev/null || stat -f%z "$zip_file" 2>/dev/null || echo 0)
              if echo "$REMOTE_LS" | grep -q "$file_name" && echo "$REMOTE_LS" | grep -q "$file_size"; then
                echo "  [OK] Course package up to date: $file_name ($file_size bytes)"
              else
                echo "  Syncing course package: $file_name ($file_size bytes)..."
                for i in 1 2 3 4; do
                  scp "$zip_file" "$SERVER_USER@$SERVER_IP:/opt/leitner-platform/$COURSES_DIR/$file_name" && break
                  echo "::warning::SCP course upload attempt $i/4 failed. Retrying in 5s..."
                  sleep 5
                done
              fi
            done
          fi

      - name: Build & Run Docker Containers
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Building and launching Docker Compose stack..."
          for i in 1 2 3 4; do
            ssh -n -T "$SERVER_USER@$SERVER_IP" \
              "cd /opt/leitner-platform && docker compose -f deployment/docker-compose.yml --env-file .env up -d --build" && break
            echo "::warning::Docker compose attempt $i/4 failed. Retrying in 5s..."
            sleep 5
          done

      - name: Verify Container State & Health
        env:
          SERVER_IP: ${{ inputs.server_ip || '45.94.215.188' }}
          SERVER_USER: ${{ inputs.server_user || 'root' }}
        run: |
          echo ">> Running Containers:"
          ssh -n -T "$SERVER_USER@$SERVER_IP" \
            "cd /opt/leitner-platform && docker compose -f deployment/docker-compose.yml ps"

          echo ">> Testing Courses Endpoint..."
          sleep 5
          STATUS_CODE=$(ssh -n -T "$SERVER_USER@$SERVER_IP" "curl -k -s -o /dev/null -w '%{http_code}' https://api.rightlearn.ir/api/v1/courses || echo '000'")
          echo "Courses endpoint HTTP status: $STATUS_CODE"

          # Close SSH master connection socket
          ssh -O exit "$SERVER_USER@$SERVER_IP" 2>/dev/null || true
          echo ">> Deployment completed successfully! 🎉"
