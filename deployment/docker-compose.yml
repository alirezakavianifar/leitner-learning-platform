services:
  # 1. PostgreSQL 16 Database Service
  db:
    image: postgres:16-alpine
    container_name: leitner-postgres-db
    restart: always
    environment:
      POSTGRES_DB: leitner_db
      POSTGRES_USER: leitner_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leitner_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - leitner-network

  # 2. Redis Caching & Event Bus Service
  redis:
    image: redis:7.2-alpine
    container_name: leitner-redis-cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - leitner-network

  # 3. ASP.NET Core Web API Server (.NET 8 LTS)
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: leitner-backend-api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=leitner_db;User Id=leitner_admin;Password=${DB_PASSWORD:-leitner_secure_pass_2026};
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:-redis_secure_pass_2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt_secret_lts_2026_super_secure_key}
      - BACKUP_S3_KEY=${BACKUP_S3_KEY}
      - BACKUP_S3_SECRET=${BACKUP_S3_SECRET}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
      - SMS_PROVIDER=${SMS_PROVIDER:-Kavenegar}
      - SMS_SENDER=${SMS_SENDER}
      - SMS_PATTERN_CODE=${SMS_PATTERN_CODE}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-false}
      - ZARINPAL_CALLBACK_URL=${ZARINPAL_CALLBACK_URL:-https://api.rightlearn.ir/api/v1/purchases/zarinpal/callback}
      - ADMIN_ALLOWED_MOBILE_NUMBERS=${ADMIN_ALLOWED_MOBILE_NUMBERS:-+989120000000,09120000000,09121234567,+989121234567}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword2026!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - leitner-network

  # 4. Pluggable React Administrative Web App
  admin:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.admin
    container_name: leitner-admin-panel
    restart: always
    ports:
      - "${ADMIN_PORT:-8081}:80"
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    networks:
      - leitner-network

  # 5. Background Schedulers & Workers
  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    entrypoint: ["dotnet", "LeitnerPlatform.BackgroundWorker.dll"]
    container_name: leitner-background-worker
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Port=5432;Database=leitner_db;User Id=leitner_admin;Password=${DB_PASSWORD:-leitner_secure_pass_2026};
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:-redis_secure_pass_2026}
      - BACKUP_S3_KEY=${BACKUP_S3_KEY}
      - BACKUP_S3_SECRET=${BACKUP_S3_SECRET}
    networks:
      - leitner-network

networks:
  leitner-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
